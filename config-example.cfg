## Example generated config for "Terminal that can kill"
## Real path after first launch: BepInEx/config/Solon.TerminalThatCanKill.cfg

[Doors]

## Master switch for the deadly-doors mechanic.
# Setting type: Boolean
Enabled = true

## Kill players caught in a closing door's threshold.
# Setting type: Boolean
KillPlayers = true

## Kill monsters caught in a closing door's threshold (only enemies that can enter the ship).
# Setting type: Boolean
KillMonsters = false

## Which doors are deadly: ShipDoor, TerminalDoors or Both.
# Setting type: AffectedDoors
# Acceptable values: ShipDoor, TerminalDoors, Both
AffectedDoors = Both

## Grace period after the ship lands during which doors do NOT kill. 0 disables it.
# Setting type: Single
# Acceptable value range: From 0 to 120
SafeZoneSeconds = 5

## InstantKill = kill immediately when the door finishes closing. DamageOverTime = damage
## players while the door stays shut on them.
# Setting type: DamageMode
# Acceptable values: InstantKill, DamageOverTime
DamageMode = InstantKill

## Damage-per-second applied to players in DamageOverTime mode (ignored for InstantKill).
# Setting type: Int32
# Acceptable value range: From 1 to 100
DamageAmount = 100

[Doors.Advanced]

## Approximate duration of the ship-door close animation. The kill check fires this long
## after the door starts closing.
# Setting type: Single
ShipDoorCloseSeconds = 1.6

## Delay (sec) between a facility door starting to close and the kill check firing. Big
## doors slam shut fast, so keep this small.
# Setting type: Single
TerminalDoorCloseSeconds = 0.4

## Depth (metres) of the kill slab THROUGH the doorway — the 'thin line'. A doorway is
## ~1.3m deep, so ~2.0 reliably catches someone in the opening while staying far tighter
## than a proximity sphere.
# Setting type: Single
# Acceptable value range: From 0.2 to 6
DoorwayThickness = 2

## Width (metres) of the kill slab across the doorway opening.
# Setting type: Single
# Acceptable value range: From 0.5 to 8
DoorwayWidth = 3

## Height (metres) of the kill slab. Kept generous so it never misses vertically.
# Setting type: Single
# Acceptable value range: From 1 to 12
DoorwayHeight = 5

## Index into StartOfRound.playerRagdolls picking which corpse spawns. 7 = the Barber
## (ClaySurgeonAI) 'Snipping' death — body is launched up and ragdolls (default). 0 = plain
## physics ragdoll that just falls. -1 = no body.
# Setting type: Int32
PlayerDeathAnimationId = 7

## Comma-separated enemy internal names that can NEVER be crushed (case-insensitive substring).
# Setting type: String
ExcludedEnemies = Girl,RadMech,Manticoil,Docile,Roaming Locust,Red Locust Bees,Locust,Earth Leviathan,Forest Giant

[RemoteControl]

## Replace terminal 'disable mine/turret' with detonate/rampage. False = vanilla (disable).
# Setting type: Boolean
EnableRemoteControl = true

## Chance (0..1) that a remote MINE command critically malfunctions (chain detonation).
# Setting type: Single
# Acceptable value range: From 0 to 1
MineErrorChance = 0.15

## Chance (0..1) that a remote TURRET command critically malfunctions (sustained rampage).
# Setting type: Single
# Acceptable value range: From 0 to 1
TurretErrorChance = 0.15

## On a mine error the blast is amplified: nearby mines within MineErrorChainRadius * this
## factor also detonate.
# Setting type: Single
# Acceptable value range: From 1 to 5
MineErrorDamageMultiplier = 2

## Seconds a turret keeps re-triggering its berserk state on an error (chaotic spin-fire).
# Setting type: Single
# Acceptable value range: From 0 to 30
TurretRampageDuration = 5

## When a turret leaves berserk, turn its head 180° from the angle it had before berserk and
## keep it there as the new resting facing until the next berserk (it can still turn to fire
## at detected players).
# Setting type: Boolean
TurretFlipOnBerserkExit = true

## Seconds the 180° head turn takes on berserk exit. 0 = instant snap.
# Setting type: Single
# Acceptable value range: From 0 to 5
TurretFlipSmoothDuration = 0.5

[RemoteControl.Advanced]

## Base radius (metres) used to find neighbouring mines for the chain reaction on a mine error.
# Setting type: Single
MineErrorChainRadius = 8

## If true, a NORMAL (non-error) mine command plays the warning beep before exploding. Errors
## always detonate instantly.
# Setting type: Boolean
MineWarnBeforeDetonate = false
